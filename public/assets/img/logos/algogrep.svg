<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grepb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <!-- Rounded blue gradient background (series spec: rx 22%, diagonal gradient) -->
  <rect width="200" height="200" rx="44" fill="url(#grepb)"/>

  <!-- Magnifier: large lens + short handle -->
  <circle cx="101" cy="101" r="58"
          stroke="white" stroke-width="12" fill="none"/>
  <path d="M141 141 L156 156"
        stroke="white" stroke-width="12"
        stroke-linecap="round" fill="none"/>

  <!-- Regex `.*` inside the lens: dot + asterisk -->
  <circle cx="74" cy="115" r="11" fill="white"/>
  <g stroke="white" stroke-width="11" stroke-linecap="round" fill="none">
    <path d="M117 80 V126"/>
    <path d="M97.1 114.5 L136.9 91.5"/>
    <path d="M97.1 91.5 L136.9 114.5"/>
  </g>
</svg>
