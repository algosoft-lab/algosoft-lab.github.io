<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="termg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square emerald gradient background -->
  <rect width="200" height="200" rx="44" fill="url(#termg)"/>

  <!-- Terminal window frame -->
  <rect x="38" y="46" width="124" height="108" rx="14"
        stroke="white" stroke-width="10" fill="none"/>

  <!-- Title bar divider -->
  <line x1="44" y1="74" x2="156" y2="74" stroke="white" stroke-width="5" stroke-linecap="round"/>

  <!-- Window control dots -->
  <circle cx="58" cy="60" r="4" fill="white"/>
  <circle cx="72" cy="60" r="4" fill="white"/>
  <circle cx="86" cy="60" r="4" fill="white"/>

  <!-- Terminal prompt ">" -->
  <path d="M56 94 L70 104 L56 114" stroke="white" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Cursor block -->
  <rect x="80" y="96" width="9" height="18" rx="2" fill="white"/>
</svg>
